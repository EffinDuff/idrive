name: Build & publish image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"   # every Monday 07:17 UTC -> picks up new IDrive + Ubuntu patches
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Ubuntu base tag"
        default: "26.04"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set build vars
        id: vars
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "ubuntu=${{ github.event.inputs.ubuntu_version || '26.04' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          build-args: |
            UBUNTU_VERSION=${{ steps.vars.outputs.ubuntu }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
          tags: |
            effinduff/idrive:latest
            effinduff/idrive:${{ steps.vars.outputs.date }}
            ghcr.io/effinduff/idrive:latest
            ghcr.io/effinduff/idrive:${{ steps.vars.outputs.date }}
